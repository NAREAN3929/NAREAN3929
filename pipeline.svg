<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Data pipeline: sources to Kafka to Spark to data lake to SQL warehouse, orchestrated by Airflow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="239" rx="14" fill="#0d1117" stroke="#30363d"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="36" width="140" height="84" rx="10" fill="#161b22" stroke="#484f58"/>
    <text x="90" y="74" font-size="16" font-weight="600" fill="#e6edf3">Sources</text>
    <text x="90" y="96" font-size="12" fill="#8b949e">apps, APIs, logs</text>

    <rect x="200" y="36" width="140" height="84" rx="10" fill="#3a2a0a" stroke="#d29922"/>
    <text x="270" y="74" font-size="16" font-weight="600" fill="#f0b429">Kafka</text>
    <text x="270" y="96" font-size="12" fill="#d9a441">event stream</text>

    <rect x="380" y="36" width="140" height="84" rx="10" fill="#3d1518" stroke="#f85149"/>
    <text x="450" y="74" font-size="16" font-weight="600" fill="#ff7b72">Spark</text>
    <text x="450" y="96" font-size="12" fill="#f0867f">stream + batch</text>

    <rect x="560" y="36" width="140" height="84" rx="10" fill="#161b22" stroke="#484f58"/>
    <text x="630" y="74" font-size="16" font-weight="600" fill="#e6edf3">Data lake</text>
    <text x="630" y="96" font-size="12" fill="#8b949e">raw + curated</text>

    <rect x="740" y="36" width="140" height="84" rx="10" fill="#0c2d6b" stroke="#388bfd"/>
    <text x="810" y="74" font-size="16" font-weight="600" fill="#79c0ff">SQL</text>
    <text x="810" y="96" font-size="12" fill="#79b8ff">warehouse models</text>

    <g stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M162 78H198"/>
      <path d="M342 78H378"/>
      <path d="M522 78H558"/>
      <path d="M702 78H738"/>
    </g>

    <g stroke="#3fb950" stroke-width="1.4" stroke-dasharray="4 4" fill="none">
      <path d="M450 122V158"/>
      <path d="M810 122V158"/>
    </g>
    <rect x="20" y="160" width="860" height="52" rx="10" fill="#0f2d1a" stroke="#3fb950" stroke-dasharray="6 5"/>
    <text x="450" y="192" font-size="15" fill="#56d364">Airflow schedules, retries, and monitors every step</text>
  </g>
</svg>
